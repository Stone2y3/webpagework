<!DOCTYPE html>
<html lang="zh-CN" data-theme="theme-blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 · BUAA OJ</title>
  <meta name="description" content="北京航空航天大学 C 语言程序设计在线评测平台（课程演示）">
  <link rel="stylesheet" href="style.css">
  <script>
    /* 在首屏渲染前设定主题，避免刷新时先闪一下默认配色 */
    (function () {
      try {
        var t = localStorage.getItem('oj_theme');
        if (t !== 'theme-blue' && t !== 'theme-green' && t !== 'theme-dark') t = 'theme-blue';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'theme-blue');
      }
    })();
  </script>
</head>
<body data-page="home">
  <header class="navbar" id="appNav"></header>

  <main class="page">
    <div id="homeRoot"></div>
  </main>

  <footer class="site-footer" id="appFooter"></footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
