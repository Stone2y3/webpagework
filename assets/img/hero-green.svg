<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="heroGreenTitle heroGreenDesc">
  <title id="heroGreenTitle">绿色低碳物流示意插画</title>
  <desc id="heroGreenDesc">晨光下的绿色园区，风力发电机、新能源货车、丘陵与叶片构成低碳物流场景。</desc>
  <defs>
    <linearGradient id="ggSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#031711"/>
      <stop offset="0.52" stop-color="#0a3a2a"/>
      <stop offset="1" stop-color="#0d4732"/>
    </linearGradient>
    <radialGradient id="ggSun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3bd" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#b8ffb0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7dffb0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ggHill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5138"/>
      <stop offset="1" stop-color="#072a1e"/>
    </linearGradient>
    <linearGradient id="ggHill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a3d2b"/>
      <stop offset="1" stop-color="#041c14"/>
    </linearGradient>
    <linearGradient id="ggRoad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123d2d"/>
      <stop offset="1" stop-color="#051c14"/>
    </linearGradient>
    <linearGradient id="ggTruck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2fff8"/>
      <stop offset="1" stop-color="#a9dcc2"/>
    </linearGradient>
    <radialGradient id="ggVignette" cx="50%" cy="55%" r="78%">
      <stop offset="0.36" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="ggBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="ggSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ggSky)"/>
  <circle cx="1230" cy="230" r="300" fill="url(#ggSun)"/>
  <circle cx="1230" cy="230" r="58" fill="#eaffd9" opacity="0.7" filter="url(#ggSoft)"/>

  <!-- 远山 -->
  <path d="M0 560 Q180 470 360 540 T760 520 T1160 545 T1600 490 V900 H0 Z" fill="#073223" opacity="0.85"/>
  <path d="M0 620 Q260 520 520 600 T980 590 T1600 560 V900 H0 Z" fill="url(#ggHill1)"/>
  <path d="M0 710 Q300 620 620 690 T1120 680 T1600 640 V900 H0 Z" fill="url(#ggHill2)"/>

  <!-- 风力发电机 -->
  <g stroke="#b9f4d5" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M1190 610 L1190 330"/>
    <path d="M1190 330 L1190 214"/>
    <path d="M1190 330 L1080 388"/>
    <path d="M1190 330 L1300 392"/>
    <path d="M1360 640 L1360 470"/>
    <path d="M1360 470 L1360 406"/>
    <path d="M1360 470 L1300 504"/>
    <path d="M1360 470 L1420 502"/>
  </g>
  <g fill="#eafff4" opacity="0.9">
    <circle cx="1190" cy="330" r="9"/>
    <circle cx="1360" cy="470" r="7"/>
  </g>

  <!-- 光伏板 -->
  <g opacity="0.85">
    <path d="M980 690 L1120 650 L1160 685 L1016 728 Z" fill="#0b3b4a" stroke="#37b6a4" stroke-width="2"/>
    <path d="M1012 681 L1052 670 M1040 703 L1080 692 M1068 725 L1108 714" stroke="#5ee3c0" stroke-width="1.2" opacity="0.7"/>
    <path d="M1016 728 L1016 752 M1150 688 L1150 712" stroke="#b9f4d5" stroke-width="4"/>
  </g>

  <!-- 道路 -->
  <path d="M0 900 L1600 700 L1600 900 Z" fill="url(#ggRoad)"/>
  <path d="M0 862 Q420 790 840 764 T1600 742" fill="none" stroke="#42d99b" stroke-width="3" opacity="0.4" stroke-dasharray="28 26"/>

  <!-- 新能源货车 -->
  <g transform="translate(620 600)">
    <ellipse cx="180" cy="196" rx="200" ry="26" fill="#02100a" opacity="0.55"/>
    <!-- 车厢 -->
    <rect x="30" y="20" width="238" height="128" rx="12" fill="url(#ggTruck)"/>
    <rect x="30" y="20" width="238" height="128" rx="12" fill="none" stroke="#eafff5" stroke-width="2" opacity="0.6"/>
    <rect x="52" y="44" width="192" height="10" rx="5" fill="#4fd8a2" opacity="0.8"/>
    <rect x="52" y="66" width="116" height="8" rx="4" fill="#7ba99a" opacity="0.55"/>
    <path d="M188 88 l-20 34 h18 l-10 32 34 -44 h-18 l14 -22 Z" fill="#00a758"/>
    <!-- 驾驶室 -->
    <path d="M268 50 q46 0 58 44 l10 54 h-68 Z" fill="#e9fff6"/>
    <path d="M284 66 q30 2 40 34 h-40 Z" fill="#0a3b2c"/>
    <rect x="268" y="148" width="70" height="10" rx="5" fill="#0a3b2c" opacity="0.4"/>
    <!-- 车轮 -->
    <g fill="#04130d" stroke="#9de9c8" stroke-width="3">
      <circle cx="96" cy="162" r="30"/>
      <circle cx="240" cy="162" r="30"/>
    </g>
    <g fill="#2fd497">
      <circle cx="96" cy="162" r="9"/>
      <circle cx="240" cy="162" r="9"/>
    </g>
    <!-- 充电线 -->
    <path d="M330 120 q60 -12 78 34" fill="none" stroke="#6cf6c0" stroke-width="4" stroke-dasharray="6 6"/>
    <rect x="404" y="148" width="18" height="40" rx="4" fill="#0a3b2c" stroke="#6cf6c0" stroke-width="2"/>
  </g>

  <!-- 漂浮叶片 -->
  <g fill="#4fe0a0" opacity="0.65">
    <path d="M420 220 q40 -26 66 4 q-30 34 -66 -4z"/>
    <path d="M860 180 q30 -18 50 4 q-24 26 -50 -4z" opacity="0.7"/>
    <path d="M520 330 q24 -14 40 2 q-18 22 -40 -2z" opacity="0.5"/>
    <path d="M1450 430 q34 -18 56 6 q-28 28 -56 -6z" opacity="0.5"/>
  </g>

  <!-- 光点 -->
  <g fill="#c8ffe2" opacity="0.75">
    <circle cx="760" cy="240" r="2.4"/>
    <circle cx="980" cy="320" r="2"/>
    <circle cx="380" cy="420" r="2"/>
    <circle cx="1120" cy="520" r="2.4"/>
    <circle cx="1500" cy="280" r="2"/>
  </g>

  <rect width="1600" height="900" fill="url(#ggVignette)"/>
</svg>
