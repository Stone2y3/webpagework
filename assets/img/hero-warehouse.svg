<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="heroWarehouseTitle heroWarehouseDesc">
  <title id="heroWarehouseTitle">智能仓储中心示意插画</title>
  <desc id="heroWarehouseDesc">深绿色调的自动化立体仓库，货架、传送带、机械臂与数据光环构成科技感场景。</desc>
  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110b"/>
      <stop offset="0.55" stop-color="#06251a"/>
      <stop offset="1" stop-color="#04150f"/>
    </linearGradient>
    <radialGradient id="hwGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#35e29a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35e29a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hwPortal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8ffec" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#6ef3b7" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1ba873" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="hwAisle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6a4a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#052018" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hwVignette" cx="50%" cy="55%" r="76%">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="hwBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="hwSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#hwBg)"/>
  <ellipse cx="1070" cy="290" rx="540" ry="390" fill="url(#hwGlow)"/>
  <ellipse cx="800" cy="470" rx="250" ry="300" fill="#2ee49b" opacity="0.12" filter="url(#hwBlur)"/>

