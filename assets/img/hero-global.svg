<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="heroGlobalTitle heroGlobalDesc">
  <title id="heroGlobalTitle">全球供应链网络示意插画</title>
  <desc id="heroGlobalDesc">深青色背景中的点阵地球、连接弧线与物流节点，表现覆盖全球的供应链网络。</desc>
  <defs>
    <linearGradient id="hgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03151a"/>
      <stop offset="0.5" stop-color="#062720"/>
      <stop offset="1" stop-color="#03170f"/>
    </linearGradient>
    <radialGradient id="hgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#31e0a0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#31e0a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hgGlobe" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#0d4c3a"/>
      <stop offset="0.65" stop-color="#073126"/>
      <stop offset="1" stop-color="#041c16"/>
    </radialGradient>
    <pattern id="hgDots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.35" fill="#4be9ad" opacity="0.6"/>
    </pattern>
    <radialGradient id="hgVignette" cx="50%" cy="55%" r="78%">
      <stop offset="0.35" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.66"/>
    </radialGradient>
    <filter id="hgBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="hgSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="hgClip">
      <circle cx="1110" cy="450" r="330"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#hgBg)"/>
  <ellipse cx="1110" cy="430" rx="520" ry="430" fill="url(#hgGlow)"/>
  <circle cx="1110" cy="450" r="380" fill="none" stroke="#1b8f69" stroke-width="1" opacity="0.35"/>

  <!-- 地球 -->
  <circle cx="1110" cy="450" r="330" fill="url(#hgGlobe)" stroke="#1e9972" stroke-width="1.5"/>
  <g clip-path="url(#hgClip)">
    <circle cx="1110" cy="450" r="330" fill="url(#hgDots)" opacity="0.55"/>
    <g fill="#0c4433" stroke="#2bb98a" stroke-width="1" opacity="0.75">
      <path d="M846 300 q60 -55 128 -34 q46 15 36 62 q-12 54 -74 58 q-52 4 -70 -30 q-18 -34 -20 -56z"/>
      <path d="M1040 236 q66 -28 118 6 q32 22 12 52 q-24 36 -82 22 q-46 -12 -48 -44z"/>
      <path d="M978 430 q54 -18 82 22 q22 32 -2 74 q-24 42 -66 34 q-38 -8 -42 -54 q-4 -50 28 -76z"/>
      <path d="M1102 552 q46 -12 62 26 q16 38 -12 86 q-26 44 -58 30 q-28 -14 -24 -62 q4 -62 32 -80z"/>
      <path d="M1240 348 q58 -20 84 10 q24 28 2 62 q-30 44 -80 24 q-44 -18 -30 -54 q10 -26 24 -42z"/>
      <path d="M1258 512 q42 -8 62 22 q20 30 0 62 q-24 38 -66 22 q-40 -16 -32 -56 q6 -38 36 -50z"/>
      <path d="M946 640 q50 -6 58 34 q6 32 -34 46 q-44 16 -58 -18 q-12 -32 34 -62z"/>
      <path d="M844 508 q36 -6 48 24 q10 28 -18 46 q-32 20 -50 -6 q-16 -26 20 -64z"/>
    </g>
    <g fill="none" stroke="#35cea0" stroke-width="1.1" opacity="0.45">
      <ellipse cx="1110" cy="450" rx="330" ry="92"/>
      <ellipse cx="1110" cy="450" rx="330" ry="190"/>
      <ellipse cx="1110" cy="450" rx="330" ry="280"/>
      <ellipse cx="1110" cy="450" rx="72" ry="330"/>
      <ellipse cx="1110" cy="450" rx="150" ry="330"/>
      <ellipse cx="1110" cy="450" rx="230" ry="330"/>
      <ellipse cx="1110" cy="450" rx="300" ry="330"/>
      <path d="M780 450 H1440"/>
    </g>
    <ellipse cx="1110" cy="450" rx="330" ry="330" fill="url(#hgGlow)" opacity="0.18"/>
  </g>
  <circle cx="1110" cy="450" r="330" fill="none" stroke="#6cf6c0" stroke-width="2" opacity="0.5"/>

  <!-- 网络连接弧线 -->
  <g fill="none" stroke="#52efb5" stroke-width="2" opacity="0.8">
    <path d="M870 330 Q1000 170 1230 300" stroke-dasharray="5 10"/>
    <path d="M980 590 Q1150 760 1370 540" stroke-dasharray="5 10"/>
    <path d="M840 460 Q1010 380 1220 510"/>
    <path d="M1000 250 Q1130 340 1180 600" stroke-dasharray="4 12" opacity="0.55"/>
    <path d="M1290 240 Q1440 400 1320 590"/>
  </g>
  <g fill="#04241a" stroke="#6cf6c0" stroke-width="2.5">
    <circle cx="870" cy="330" r="9"/>
    <circle cx="1230" cy="300" r="9"/>
    <circle cx="980" cy="590" r="9"/>
    <circle cx="1370" cy="540" r="9"/>
    <circle cx="840" cy="460" r="7"/>
    <circle cx="1290" cy="240" r="7"/>
  </g>
  <g fill="#7ef7c7" opacity="0.9">
    <circle cx="870" cy="330" r="3"/>
    <circle cx="1230" cy="300" r="3"/>
    <circle cx="980" cy="590" r="3"/>
    <circle cx="1370" cy="540" r="3"/>
  </g>

  <!-- 飞行示意 -->
  <g transform="translate(1190 210) rotate(18)" fill="#9ffbd6">
    <path d="M0 0 L30 8 L4 20 L8 10 L-10 12 Z"/>
  </g>
  <g transform="translate(910 640) rotate(-24)" fill="#9ffbd6" opacity="0.65">
    <path d="M0 0 L22 6 L3 15 L6 7 L-8 9 Z"/>
  </g>

  <!-- 外贸航线刻度 -->
  <g fill="none" stroke="#45e6a8" opacity="0.45">
    <circle cx="1372" cy="198" r="66" stroke-width="1" stroke-dasharray="2 8"/>
    <circle cx="1372" cy="198" r="40" stroke-width="1"/>
    <path d="M1306 198 H1332 M1412 198 H1438 M1372 132 V158 M1372 238 V264" stroke-width="1.5"/>
    <path d="M250 640 h90 M250 660 h140 M250 680 h70" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>
  <g fill="#7af7c6" opacity="0.7">
    <circle cx="340" cy="220" r="2.4"/>
    <circle cx="520" cy="150" r="2"/>
    <circle cx="680" cy="260" r="2.6"/>
    <circle cx="420" cy="700" r="2"/>
    <circle cx="1460" cy="330" r="2.4"/>
  </g>

  <rect width="1600" height="900" fill="url(#hgVignette)"/>
</svg>
